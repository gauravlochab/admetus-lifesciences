<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Circular swoosh -->
  <ellipse cx="40" cy="40" rx="30" ry="30" stroke="url(#swoosh-grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="155 33" transform="rotate(-30 40 40)"/>
  <!-- Inner green arc accent -->
  <path d="M18 55 Q10 40 18 25" stroke="#3EAA58" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- AD Monogram -->
  <!-- A -->
  <path d="M28 52 L37 24 L42 52" stroke="#8B6B2A" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30.5" y1="42" x2="40" y2="42" stroke="#8B6B2A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- D -->
  <path d="M42 24 L42 52 Q56 52 56 38 Q56 24 42 24 Z" stroke="#8B6B2A" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf at bottom -->
  <path d="M55 58 Q60 50 54 44" stroke="#3EAA58" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M55 58 Q48 54 54 44" fill="#3EAA58" opacity="0.7"/>
  <circle cx="55" cy="60" r="1.5" fill="#3EAA58"/>

  <!-- "Admetus" text -->
  <g transform="translate(82, 18)">
    <!-- Stylized A with leaf -->
    <text font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#2D8E4E" letter-spacing="-0.5">
      <tspan>A</tspan><tspan fill="#2D8E4E">dmetus</tspan>
    </text>
    <!-- Small leaf on the A -->
    <path d="M8 4 Q12 -2 16 2 Q12 6 8 4Z" fill="#3EAA58"/>
  </g>

  <!-- "LIFESCIENCES" text with decorative lines -->
  <g transform="translate(82, 62)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#2BACC2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="27" y="4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#2BACC2" letter-spacing="3">LIFESCIENCES</text>
    <line x1="162" y1="0" x2="184" y2="0" stroke="#2BACC2" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="swoosh-grad" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2BACC2"/>
      <stop offset="50%" stop-color="#33C4A0"/>
      <stop offset="100%" stop-color="#3EAA58"/>
    </linearGradient>
  </defs>
</svg>
